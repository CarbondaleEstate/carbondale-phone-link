<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#B5121B">
  <link rel="manifest" href="manifest.json">
  <title>Carbondale Phone Link</title>
  <style>
    :root { --red:#B5121B; }
    * { box-sizing:border-box; }
    html,body { min-height:100%; margin:0; background:#000; color:var(--red); font-family:Arial,Helvetica,sans-serif; }
    body { display:flex; align-items:center; justify-content:center; padding:28px; }
    .shell { width:min(620px,100%); border:1px solid var(--red); border-radius:24px; background:#030303; padding:26px; }
    .brand { font-size:12px; letter-spacing:.34em; opacity:.78; }
    h1 { margin:12px 0 8px; font-size:31px; font-weight:600; }
    p { margin:0 0 18px; line-height:1.45; color:#a60f18; }
    .status { min-height:50px; border:1px solid #3d0509; border-radius:15px; padding:14px; background:#050505; margin:18px 0; line-height:1.4; }
    button { width:100%; border:1px solid var(--red); border-radius:14px; background:#000; color:var(--red); font-weight:700; padding:15px 14px; margin-top:10px; font-size:14px; }
    button:active { background:#140103; }
    .secondary { border-color:#64090e; color:#8e0d14; }
    textarea { width:100%; min-height:155px; margin-top:12px; border:1px solid #3d0509; border-radius:12px; background:#000; color:#7f0b11; padding:12px; font-family:Consolas,monospace; font-size:11px; resize:vertical; }
    .small { font-size:12px; opacity:.72; margin-top:14px; }
    .hidden { display:none; }
  </style>
</head>
<body>
  <main class="shell">
    <div class="brand">CARBONDALE</div>
    <h1>Phone Link</h1>
    <p>Phone-side diagnostic and pairing. No SMS and no phone number are used.</p>
    <div id="status" class="status">Preparing phone-side test…</div>

    <button id="localTest">TEST NOTIFICATION ON THIS IPHONE</button>
    <button id="pair" class="secondary">PAIR / REPAIR THIS IPHONE</button>

    <section id="pairingArea" class="hidden">
      <textarea id="pairingText" readonly aria-label="Pairing data"></textarea>
      <button id="copy">COPY PAIRING DATA</button>
    </section>

    <div class="small">v0.3 — The first button tests the iPhone itself. It does not use the PC or remote push.</div>
  </main>
<script>
const VAPID_PUBLIC_KEY = 'BKMeLu16Zdt-vT8V1YLf5DUVssKPZLxpmBcIaFjx8jOMl3nr5SM-sgjaQtebOHB0cHDZWOpJ5SpqHoo4rEQq9mY';
const SITE = 'https://carbondaleestate.github.io/carbondale-phone-link/';
const statusEl = document.getElementById('status');
const area = document.getElementById('pairingArea');
const pairingText = document.getElementById('pairingText');

function setStatus(t) { statusEl.textContent = t; }
function b64ToUint8Array(base64String) {
  const padding = '='.repeat((4 - base64String.length % 4) % 4);
  const base64 = (base64String + padding).replace(/-/g, '+').replace(/_/g, '/');
  const raw = atob(base64);
  return Uint8Array.from([...raw].map(c => c.charCodeAt(0)));
}
function pairedJson(sub) {
  const j = sub.toJSON();
  return JSON.stringify({
    version: 'CarbondalePhonePairing/1',
    site: SITE,
    endpoint: j.endpoint,
    p256dh: j.keys.p256dh,
    auth: j.keys.auth,
    vapidPublicKey: VAPID_PUBLIC_KEY
  }, null, 2);
}
async function ensureWorker() {
  if (!('serviceWorker' in navigator)) throw new Error('Service workers are not available here.');
  const reg = await navigator.serviceWorker.register('service-worker.js', { scope:'./', updateViaCache:'none' });
  try { await reg.update(); } catch (_) {}
  await navigator.serviceWorker.ready;
  return navigator.serviceWorker.ready;
}
async function ensurePermission() {
  let p = Notification.permission;
  if (p !== 'granted') p = await Notification.requestPermission();
  if (p !== 'granted') throw new Error('Notification permission is not granted.');
}

async function localTest() {
  try {
    setStatus('Testing notification display on this iPhone…');
    const reg = await ensureWorker();
    await ensurePermission();
    await reg.showNotification('CARBONDALE', {
      body: 'Phone-side notification test passed.',
      tag: 'carbondale-local-test',
      renotify: true,
      data: { url: '/carbondale-phone-link/' }
    });
    setStatus('LOCAL TEST SENT. You should see a CARBONDALE notification on this iPhone now.');
  } catch (e) {
    setStatus('LOCAL TEST FAILED: ' + (e && e.message ? e.message : e));
  }
}

async function pairPhone() {
  try {
    setStatus('Preparing a fresh push subscription…');
    const reg = await ensureWorker();
    await ensurePermission();
    if (!('PushManager' in window)) throw new Error('Web Push is unavailable here. Open the installed Home Screen app.');
    const old = await reg.pushManager.getSubscription();
    if (old) await old.unsubscribe();
    const sub = await reg.pushManager.subscribe({
      userVisibleOnly: true,
      applicationServerKey: b64ToUint8Array(VAPID_PUBLIC_KEY)
    });
    pairingText.value = pairedJson(sub);
    area.classList.remove('hidden');
    setStatus('PAIRED WITH A FRESH SUBSCRIPTION. Copy the pairing data back to ChatGPT.');
  } catch (e) {
    setStatus('PAIRING FAILED: ' + (e && e.message ? e.message : e));
  }
}

document.getElementById('localTest').addEventListener('click', localTest);
document.getElementById('pair').addEventListener('click', pairPhone);
document.getElementById('copy').addEventListener('click', async () => {
  try {
    await navigator.clipboard.writeText(pairingText.value);
    setStatus('Pairing data copied. Paste it into this ChatGPT conversation.');
  } catch (_) {
    pairingText.focus(); pairingText.select();
    setStatus('Copy was blocked. The pairing text is selected; use Copy from the iPhone menu.');
  }
});

ensureWorker().then(() => {
  const standalone = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;
  if (!standalone) setStatus('Open this from the installed Carbondale Home Screen icon.');
  else setStatus('READY. First tap TEST NOTIFICATION ON THIS IPHONE.');
}).catch(e => setStatus('SETUP FAILED: ' + e.message));
</script>
</body>
</html>
